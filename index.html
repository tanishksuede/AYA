<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="manifest" href="/manifest.json">
  
  <!-- CRITICAL: iOS viewport fix — prevents black screen from viewport height issues -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />

  <!-- iOS Safari web app meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="At Your Age" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Force iOS Safari to use hardware acceleration -->
  <meta name="format-detection" content="telephone=no" />

  <!-- Prevent iOS link preview popups from breaking layout -->
  <meta name="apple-touch-fullscreen" content="yes" />

  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>At Your Age — AYA</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-30ZXCBJXSQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-30ZXCBJXSQ');
  </script>

  <!-- Google Translate -->
  <style>
    /* Hide the ugly Google Translate widget */
    .skiptranslate, #google_translate_element, .goog-te-banner-frame {
        display: none !important;
    }
    body {
        top: 0px !important; 
    }
  </style>
</head>

<body>
  <div id="google_translate_element"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'en,hi', autoDisplay: false}, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- 
      Loading screen shown before React mounts.
      Prevents black flash on iOS.
      Hidden by JS once app is ready.
    -->
    <div id="app-loader" style="
      position: fixed;
      inset: 0;
      background: #04070f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.4s ease;
    ">
      <div style="
        width: 40px;
        height: 40px;
        border: 2px solid rgba(224, 176, 96, 0.2);
        border-top-color: #e0b060;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      "></div>
      <p style="
        color: rgba(224, 176, 96, 0.6);
        font-size: 0.85rem;
        margin-top: 1.5rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      ">Loading</p>
    </div>

    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <div id="root"></div>

    <script>
      // Hide loader once page is interactive
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('app-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(function() {
              loader.style.display = 'none';
            }, 400);
          }
        }, 300);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
